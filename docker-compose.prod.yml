name: ${REPO_NAME}

services:
  backend:
    image: docker.io/${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/${REPO_NAME:?REPO_NAME is required}-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-5000}
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRY: ${JWT_EXPIRY:-7d}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_NAME: ${ADMIN_NAME:-Scholastica Admin}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      FRONTEND_PUBLIC_SITE_URL: ${FRONTEND_PUBLIC_SITE_URL:-}
    expose:
      - "${BACKEND_PORT:-5000}"
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://0.0.0.0:' + (process.env.PORT || 5000) + '/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: docker.io/${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/${REPO_NAME:?REPO_NAME is required}-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-5000}
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://0.0.0.0:8080/health >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app:
    driver: bridge
