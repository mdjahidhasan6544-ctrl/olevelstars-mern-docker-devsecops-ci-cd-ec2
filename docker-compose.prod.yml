name: ${REPO_NAME}

services:
  backend:
    image: docker.io/${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/${REPO_NAME:?REPO_NAME is required}-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-5000}
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRY: ${JWT_EXPIRY:-7d}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_NAME: ${ADMIN_NAME:-Scholastica Admin}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      FRONTEND_PUBLIC_SITE_URL: ${FRONTEND_PUBLIC_SITE_URL:-}
    expose:
      - "${BACKEND_PORT:-5000}"
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:' + (process.env.PORT || 5000) + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: docker.io/${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/${REPO_NAME:?REPO_NAME is required}-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-5000}
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: ".template"
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=1777
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  app:
    driver: bridge
    name: ${REPO_NAME:-app}_network
