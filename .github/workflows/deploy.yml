name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ec2-production-${{ github.ref }}
  cancel-in-progress: false

env:
  FRONTEND_DIR: frontend
  BACKEND_DIR: backend
  NODE_VERSION: "22"
  IMAGE_TAG: ${{ github.sha }}
  RAW_REPO_NAME: ${{ vars.REPO_NAME || github.event.repository.name }}
  NODE_ENV_VALUE: ${{ vars.NODE_ENV || 'production' }}
  FRONTEND_PORT_VALUE: ${{ vars.FRONTEND_PORT || '80' }}
  BACKEND_PORT_VALUE: ${{ vars.BACKEND_PORT || '5000' }}
  TRIVY_VERSION: v0.71.0
  TRIVY_CACHE_DIR: .trivycache
  TRIVY_FS_SCANNERS: vuln,secret,misconfig
  TRIVY_IMAGE_SCANNERS: vuln,secret
  TRIVY_GATE_SEVERITY: HIGH,CRITICAL

jobs:
  test-and-scan:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci --prefix frontend
      - run: npm ci --prefix backend

      # =========================
      # TRIVY FS (NO BLOCK)
      # =========================
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Trivy FS Scan
        run: |
          trivy fs \
            --scanners "$TRIVY_FS_SCANNERS" \
            --severity "$TRIVY_GATE_SEVERITY" \
            --ignore-unfixed \
            --format table \
            --exit-code 0 \
            .

  build-scan-push:
    needs: test-and-scan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - run: docker build -t frontend ./frontend
      - run: docker build -t backend ./backend

      - uses: aquasecurity/setup-trivy@v0.3.1

      # =========================
      # TRIVY IMAGE (NO BLOCK)
      # =========================
      - name: Scan Frontend Image
        run: |
          trivy image \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            --exit-code 0 \
            frontend

      - name: Scan Backend Image
        run: |
          trivy image \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            --exit-code 0 \
            backend

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Images
        run: |
          docker tag frontend ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}
          docker tag backend ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ github.sha }}

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ github.sha }}

  deploy:
    needs: build-scan-push
    runs-on: ubuntu-24.04

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/app

            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ github.sha }}

            docker compose down
            docker compose up -d

            echo "Deployment successful"
