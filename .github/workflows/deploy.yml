name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FRONTEND_DIR: frontend
  BACKEND_DIR: backend
  NODE_VERSION: "22"
  IMAGE_TAG: ${{ github.sha }}
  REPO_NAME: ${{ github.event.repository.name }}

jobs:

# =========================
# 1. TEST + SCAN (NO BLOCK)
# =========================
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci --prefix frontend
      - run: npm ci --prefix backend

      - name: Trivy Scan (non-blocking)
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.71.0

      - run: |
          trivy fs . --exit-code 0 --severity HIGH,CRITICAL

# =========================
# 2. BUILD + PUSH
# =========================
  build:
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${IMAGE_TAG} ./frontend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend:${IMAGE_TAG} ./backend

      - name: Docker Login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push Images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${IMAGE_TAG}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend:${IMAGE_TAG}

# =========================
# 3. DEPLOY TO EC2
# =========================
  deploy:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e

            DEPLOY_PATH=/opt/app

            # FIX: folder missing issue
            sudo mkdir -p $DEPLOY_PATH
            sudo chown -R $USER:$USER $DEPLOY_PATH

            cd $DEPLOY_PATH

            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ github.sha }}

            docker compose down || true
            docker compose up -d

            echo "✅ Deployment Successful"
