name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ec2-production-${{ github.ref }}
  cancel-in-progress: false

env:
  FRONTEND_DIR: frontend
  BACKEND_DIR: backend
  NODE_VERSION: "22"
  IMAGE_TAG: ${{ github.sha }}
  RAW_REPO_NAME: ${{ vars.REPO_NAME || github.event.repository.name }}
  NODE_ENV_VALUE: ${{ vars.NODE_ENV || 'production' }}
  FRONTEND_PORT_VALUE: ${{ vars.FRONTEND_PORT || '80' }}
  BACKEND_PORT_VALUE: ${{ vars.BACKEND_PORT || '5000' }}
  FRONTEND_PUBLIC_SITE_URL_VALUE: ${{ vars.FRONTEND_PUBLIC_SITE_URL || '' }}

jobs:
  test-and-scan:
    name: Test and scan source
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix "$FRONTEND_DIR"
          npm ci --prefix "$BACKEND_DIR"

      - name: Run lint, tests, and builds when available
        shell: bash
        run: |
          set -euo pipefail

          run_script_if_present() {
            local dir="$1"
            local script="$2"

            if node -e "const scripts = require('./${dir}/package.json').scripts || {}; process.exit(scripts['${script}'] ? 0 : 1);"; then
              npm --prefix "$dir" run "$script"
            else
              echo "No ${script} script in ${dir}; skipping."
            fi
          }

          run_script_if_present "$FRONTEND_DIR" lint
          run_script_if_present "$FRONTEND_DIR" test
          run_script_if_present "$FRONTEND_DIR" build
          run_script_if_present "$BACKEND_DIR" lint
          run_script_if_present "$BACKEND_DIR" test
          run_script_if_present "$BACKEND_DIR" build

      - name: Run npm dependency audits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-reports

          frontend_status=0
          backend_status=0

          npm audit --prefix "$FRONTEND_DIR" --audit-level=high --json > security-reports/frontend-npm-audit.json || frontend_status=$?
          npm audit --prefix "$BACKEND_DIR" --audit-level=high --json > security-reports/backend-npm-audit.json || backend_status=$?

          if [ "$frontend_status" -ne 0 ] || [ "$backend_status" -ne 0 ]; then
            echo "npm audit found high or critical vulnerabilities."
            exit 1
          fi

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-reports
          path: security-reports/*-npm-audit.json
          if-no-files-found: ignore

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: security-reports/trivy-fs.sarif

      - name: Upload Trivy filesystem report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-report
          path: security-reports/trivy-fs.sarif
          if-no-files-found: ignore

  build-scan-push:
    name: Build, scan, and push images
    runs-on: ubuntu-24.04
    needs: test-and-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image metadata
        shell: bash
        run: |
          set -euo pipefail
          repo_name="$(printf '%s' "$RAW_REPO_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed -E 's/^-+|-+$//g')"

          if [ -z "$repo_name" ]; then
            echo "Repository name resolved to an empty value."
            exit 1
          fi

          {
            echo "REPO_NAME=$repo_name"
            echo "FRONTEND_IMAGE=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${repo_name}-frontend"
            echo "BACKEND_IMAGE=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${repo_name}-backend"
          } >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --load \
            --file "$FRONTEND_DIR/Dockerfile" \
            --tag "$FRONTEND_IMAGE:$IMAGE_TAG" \
            --tag "$FRONTEND_IMAGE:latest" \
            "$FRONTEND_DIR"

      - name: Build backend image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --load \
            --file "$BACKEND_DIR/Dockerfile" \
            --tag "$BACKEND_IMAGE:$IMAGE_TAG" \
            --tag "$BACKEND_IMAGE:latest" \
            "$BACKEND_DIR"

      - name: Run Trivy frontend image scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-frontend-image.sarif

      - name: Run Trivy backend image scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-backend-image.sarif

      - name: Upload Trivy image reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-reports
          path: |
            trivy-frontend-image.sarif
            trivy-backend-image.sarif
          if-no-files-found: ignore

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images
        shell: bash
        run: |
          set -euo pipefail
          docker push "$FRONTEND_IMAGE:$IMAGE_TAG"
          docker push "$FRONTEND_IMAGE:latest"
          docker push "$BACKEND_IMAGE:$IMAGE_TAG"
          docker push "$BACKEND_IMAGE:latest"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-24.04
    needs: build-scan-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment metadata
        shell: bash
        run: |
          set -euo pipefail
          repo_name="$(printf '%s' "$RAW_REPO_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed -E 's/^-+|-+$//g')"

          if [ -z "$repo_name" ]; then
            echo "Repository name resolved to an empty value."
            exit 1
          fi

          {
            echo "REPO_NAME=$repo_name"
            echo "DEPLOY_PATH=/opt/$repo_name"
          } >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Generate deployment environment file
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          write_env() {
            local key="$1"
            local value="${2:-}"
            value="${value//\\/\\\\}"
            value="${value//\'/\\\'}"
            printf "%s='%s'\n" "$key" "$value" >> deploy.env
          }

          : > deploy.env
          write_env DOCKERHUB_USERNAME "$DOCKERHUB_USERNAME"
          write_env REPO_NAME "$REPO_NAME"
          write_env IMAGE_TAG "$IMAGE_TAG"
          write_env NODE_ENV "$NODE_ENV_VALUE"
          write_env MONGODB_URI "$MONGODB_URI"
          write_env JWT_SECRET "$JWT_SECRET"
          write_env JWT_EXPIRY "7d"
          write_env ADMIN_USERNAME "$ADMIN_USERNAME"
          write_env ADMIN_PASSWORD "$ADMIN_PASSWORD"
          write_env BACKEND_PORT "$BACKEND_PORT_VALUE"
          write_env FRONTEND_PORT "$FRONTEND_PORT_VALUE"
          write_env FRONTEND_PUBLIC_SITE_URL "$FRONTEND_PUBLIC_SITE_URL_VALUE"
          write_env CORS_ORIGIN "$FRONTEND_PUBLIC_SITE_URL_VALUE"

      - name: Create EC2 deployment directory
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/ec2_key" "$EC2_USER@$EC2_HOST" \
            "sudo mkdir -p '$DEPLOY_PATH' && sudo chown -R '$EC2_USER':'$EC2_USER' '$DEPLOY_PATH'"

      - name: Upload Compose and environment files
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/ec2_key" docker-compose.prod.yml "$EC2_USER@$EC2_HOST:$DEPLOY_PATH/docker-compose.prod.yml"
          scp -i "$HOME/.ssh/ec2_key" deploy.env "$EC2_USER@$EC2_HOST:$DEPLOY_PATH/.env"

      - name: Login to Docker Hub on EC2
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DOCKERHUB_TOKEN" | ssh -i "$HOME/.ssh/ec2_key" "$EC2_USER@$EC2_HOST" \
            "cd '$DEPLOY_PATH' && docker login -u '$DOCKERHUB_USERNAME' --password-stdin"

      - name: Deploy containers on EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/ec2_key" "$EC2_USER@$EC2_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"

          on_error() {
            echo "Deployment failed. Container status:"
            docker compose -f docker-compose.prod.yml ps || true
            echo "Recent frontend logs:"
            docker compose -f docker-compose.prod.yml logs --no-color --tail=100 frontend || true
            echo "Recent backend logs:"
            docker compose -f docker-compose.prod.yml logs --no-color --tail=100 backend || true
          }

          trap on_error ERR

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml exec -T frontend wget -qO- http://0.0.0.0:8080/health >/dev/null
          docker compose -f docker-compose.prod.yml exec -T backend node -e "fetch('http://0.0.0.0:' + (process.env.PORT || 5000) + '/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"

          if [ -f CURRENT_IMAGE_TAG ]; then
            cp CURRENT_IMAGE_TAG PREVIOUS_IMAGE_TAG
          fi

          printf '%s\n' "$IMAGE_TAG" > CURRENT_IMAGE_TAG
          docker image prune -f
          REMOTE
